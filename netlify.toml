# Netlify detecta Next.js y aplica solo su adaptador oficial (OpenNext,
# @netlify/plugin-nextjs), que soporta App Router y Server Actions.
# No se fija la versión del adaptador: Netlify recomienda dejar que se actualice solo.

[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"
